name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, smoke test, and RTL vs the third-party ITCH oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install Verilator, Icarus Verilog, and the oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog g++ yosys nextpnr-ecp5
          pip install -r scripts/requirements.txt

      - name: checked-in oracle vectors are reproducible from the oracle
        run: |
          python3 scripts/gen_itch50_oracle.py /tmp/regen
          cmp /tmp/regen/itch50_oracle.txt tests/data/itch50_oracle.txt

      - name: lint (0 warnings required)
        run: make lint

      - name: smoke test (Icarus Verilog)
        run: make smoke

      - name: RTL vs third-party oracle (Verilator)
        run: make diff

      - name: mutation testing (every injected RTL bug must be caught)
        run: scripts/mutate.sh

      - name: synthesis + place-and-route (ECP5; must complete — Fmax is reported, not gated)
        run: synth/run_synth.sh
